<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Mortgage repayment calculator</title>
</head>

<body>
  <main class="container">
    <form action="" class="calculator">
      <section class="calculator__header">
        <h1>Mortgage Calculator</h1>
        <button type="reset">Clear All</button>
      </section>
      <label class="amount" for="amount">Mortgage Amount</label>
      <div class="amount__input">
        <p>£</p>
        <input type="number" id="amount" name="amount" required>
      </div>
      <section class="calculator__terms">
        <div class="term">
        <label for="term">Mortgage Term</label>
        <div class="terms__input">
          <input type="number" id="term" name="term" required>
          <p>years</p>
        </div>
        </div>
        <div class="interest">
        <label for="interest-rate">Interest Rate</label>
        <div class="terms__input terms__input-interest">
          <input type="number" min="1" max="100" id="interest-rate" name="interes-rate" required>
          <p>%</p>
        </div>
        </div>
      </section>
      <section class="mortgage__type">
        <p>Mortgage Type</p>
        <label for="repayment" class="mortgage__type-label">
          <input type="radio" id="repayment" name="type" value="repayment" required>
          <span>Repayment</span>
        </label>
        <label for="interest-only" class="mortgage__type-label">
          <input type="radio" id="interest-only"  name="type" value="interest-only">
          <span>Interest Only</span>
        </label>
      </section>
      <button class="button__submit" type="submit">
        <img src="./assets/images/icon-calculator.svg" alt="Calculator icon">
        Calculate Repayment
      </button>
    </form>
     <section class="results">
        <img src="./assets/images/illustration-empty.svg" alt="Calculator image">
        <h2>Results shown here</h2>
        <p>
          Complete the form and click "calculate repayments" to see what your monthly repayments would be.
        </p>
      </section>
  </main>
</body>

</html>
